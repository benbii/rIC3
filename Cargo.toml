[package]
name = "rIC3"
version = "1.5.2"
edition = "2024"
authors = ["Yuheng Su <gipsyh.icu@gmail.com>"]
repository = "https://github.com/gipsyh/rIC3"
description = "hardware model checker"
keywords = ["formal-method", "model-checking", "IC3"]
license = "GPL-3.0"

[[bin]]
name = "ric3"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
rand = "0.10.0"
bitfield-struct = "0.12.1"
tempfile = "3.25.0"
nix = { version = "0.31.1", features = ["signal"] }
env_logger = "0.11.8"
log = "0.4.27"
time = { version = "0.3.46", features = ["formatting", "macros"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
bincode = "1.3.3"
anyhow = "1.0.101"
strum = { version = "0.27.2", features = ["derive"] }
enum-as-inner = "0.7.0"
num-bigint = "0.4.5"
num-traits = "0.2.19"
serde_json = "1.0.145"
lazy_static = "1.5.0"
ahash = "0.8.11"
inventory = "0.3.20"
enumflags2 = "0.7"
nalgebra = "0.35.0"

[build-dependencies]
cmake = "0.1.50"

[profile.dev]
opt-level = 3

[profile.release]
lto = true
panic = "abort"
strip = true
