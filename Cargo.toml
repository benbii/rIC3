[package]
name = "rIC3"
version = "1.5.2"
edition = "2024"
authors = ["Yuheng Su <gipsyh.icu@gmail.com>"]
repository = "https://github.com/gipsyh/rIC3"
description = "hardware model checker"
keywords = ["formal-method", "model-checking", "IC3"]
license = "GPL-3.0"

[[bin]]
name = "ric3"
path = "src/main.rs"

[dependencies]
logicrs = { path = "./deps/logicrs", version = "0.6.1" }
clap = { version = "4.5.56", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.0"
ctrlc = { version = "3.4.1", features = ["termination"] }
bitfield-struct = "0.12.1"
tempfile = "3.25.0"
process_control = "5.0.0"
nix = { version = "0.31.1", features = ["signal"] }
env_logger = "0.11.8"
log = "0.4.27"
time = { version = "0.3.46", features = ["formatting", "macros"] }
toml = "0.9.11"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
sha2 = "0.10.9"
ratatui = "0.30.0"
anyhow = "1.0.101"
ron = "0.12.0"
strum = "0.27.2"
tabled = { version = "0.20.0", features = ["ansi"] }
vcd = "0.7.0"
enum-as-inner = "0.7.0"
rayon = "1.10.0"
num-bigint = "0.4.5"
num-traits = "0.2.19"
serde_json = "1.0.145"
lazy_static = "1.5.0"
ahash = "0.8.11"

[build-dependencies]
cmake = "0.1.50"
pkg-config = "0.3.32"

[features]
vendor = []

[profile.dev]
opt-level = 3

[profile.release]
lto = true
panic = "abort"
strip = true
